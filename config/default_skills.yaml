# Default skills for benchmarking against control.
# Use with:
#   python -m a11y_llm_tests.harbor export --skills-file config/default_skills.yaml
#
# Harbor copies each skill directory (SKILL.md and support files) into /skills
# and exposes it through environment.skills_dir. Use --resume-trajectory for
# a continuous agent conversation. Every turn's submission is captured and
# evaluated separately so the report can show control and per-turn deltas.
#
# Template tokens supported in turn prompts:
#   {{test_case_prompt}}   - the user prompt composed from prompt.yaml (exactly one
#                            turn must reference this, typically turn 0).
#   {{skill_id}}           - the skill id.
#   {{skill_path}}         - absolute container path to the skill directory
#                            (e.g. /skills/building-accessible-ui).
#   {{previous_submission}} - legacy Copilot only. With Harbor, instruct the
#                            agent to read /app/output/index.html instead.

skills:
  - id: building-accessible-ui
    name: Building Accessible UI
    description: >-
      A skill that implicitly steers generation toward accessible HTML and can be explicitly invoked to review and remediate previously produced HTML. This skill provides expert guidance on accessibility best practices, including semantic HTML, ARIA roles, and color contrast.
    url: https://github.com/microsoft/a11y-llm-eval/tree/main/config/skills/building-accessible-ui
    skill_dir: skills/building-accessible-ui
    # Legacy Copilot only. With Harbor, use --n-attempts instead.
    # samples: 3
    turns:
      - id: generate
        name: Generate
        prompt: |
          {{test_case_prompt}}
      - id: review
        name: Review
        prompt: |
          Add and run accessibility tests, review results, and remediate the HTML.
          Fix any real accessibility issues you find. Leave correct markup
          alone. Submit one corrected standalone HTML document as your final
          answer. Do not wrap it in markdown fences or add commentary.
