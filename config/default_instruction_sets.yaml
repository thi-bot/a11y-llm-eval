# Default instruction sets for benchmarking (vs control).
# Use with:
#   python -m a11y_llm_tests.harbor export --instruction-sets-file config/default_instruction_sets.yaml
# Set sample counts using Harbor's --n-attempts. The samples overrides below
# apply only to the legacy Copilot runner and must stay disabled for Harbor.

instruction_sets:
  - id: accessible_minimal
    name: 0. Minimal
    description: Minimal reminder that all output must be accessible.
    url: https://github.com/microsoft/a11y-llm-eval/blob/main/config/instructions/accessible-minimal.md
    instructions_markdown: instructions/accessible-minimal.md
    # Optional override. If omitted, defaults to the same value as --samples.
    # samples: 5
  - id: accessible_basic
    name: 1. Basic
    description: Basic reminder that all output must be accessible (includes slightly more instructions than minimal).
    url: https://github.com/microsoft/a11y-llm-eval/blob/main/config/instructions/accessible-basic.md
    instructions_markdown: instructions/accessible-basic.md
    # Optional override. If omitted, defaults to the same value as --samples.
    # samples: 5
  #- id: detailed
  #  name: 2. Detailed Instructions
  #  description: Detailed instructions for accessibility.
  #  instructions_markdown: instructions/detailed.md
    # Optional override. If omitted, defaults to the same value as --samples.
    # samples: 10
